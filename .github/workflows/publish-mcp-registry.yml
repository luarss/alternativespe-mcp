name: Publish to MCP Registry

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Runs only after the protected "release" environment approves this run.
    # Configure required reviewers / allowed tags on the environment in
    # Settings > Environments to gate who can trigger a real publish.
    environment: release
    permissions:
      id-token: write # Required for GitHub OIDC authentication to the MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      ### Publish underlying npm package (alternativespe-mcp)

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1, newer than the
      # runner default. This replaces NPM_TOKEN entirely.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build package
        run: npm run build --if-present

      # No NODE_AUTH_TOKEN: auth is via short-lived OIDC (id-token: write above)
      # against the trusted publisher configured on npmjs.com. Provenance is
      # generated automatically. Idempotent so the job can be safely re-run:
      # if the version is already on npm, skip instead of failing.
      - name: Publish package to npm (trusted publishing)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "alternativespe-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "alternativespe-mcp@${VERSION} is already on npm — skipping publish."
          else
            npm publish --access public
          fi

      ### Publish server.json to the MCP Registry

      # npm processes publishes asynchronously (a new version can take several
      # minutes to become readable). The MCP Registry validates that the npm
      # version exists, so wait for it to go live before registering.
      - name: Wait for npm version to be live
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 30); do
            if npm view "alternativespe-mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "alternativespe-mcp@${VERSION} is live on npm."
              exit 0
            fi
            echo "Waiting for npm to process ${VERSION} (attempt ${i}/30)..."
            sleep 20
          done
          echo "Timed out waiting for npm to publish ${VERSION}." >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Sync version in server.json with the release tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp.json
          mv server.tmp.json server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
